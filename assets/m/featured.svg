<svg xmlns="http://www.w3.org/2000/svg" width="400" height="445" viewBox="0 0 400 445" role="img" aria-label="Quadrant Display Automation at TUMO: schedule screens that read live data from Google Sheets. Robust parsing, admin panel, Raspberry Pi kiosk.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2130"/><stop offset="1" stop-color="#0f141c"/></linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#1f6feb" stop-opacity=".42"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="443" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="443" rx="22" fill="url(#gl)"/>
  <rect x="1" y="1" width="398" height="443" rx="22" fill="url(#hi)"/>
  <rect x="1.5" y="1.5" width="397" height="442" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
  
  <g transform="translate(20,20) scale(0.857)"><rect width="56" height="56" rx="14.6" fill="#1f6feb"/><rect width="56" height="56" rx="14.6" fill="url(#ib)"/><rect x="12" y="15" width="32" height="21" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="24" y="38" width="8" height="4" fill="#fff"/><rect x="18" y="42" width="20" height="3" rx="1.5" fill="#fff"/></g><text x="82" y="40" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Quadrant Display</text><text x="82" y="60" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="rgba(230,237,243,.62)" text-anchor="start">Automation · TUMO</text><text x="20" y="100" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">Staff used to update the center's schedule</text><text x="20" y="120" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">screens by hand. Now the screens read live</text><text x="20" y="140" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">data from Google Sheets and update themselves.</text><rect x="20" y="166" width="360" height="91" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="38" cy="187" r="4.5" fill="#58a6ff"/><text x="52" y="192" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Robust parsing</text><text x="36" y="214" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">Finds data blocks by cell formatting, so it</text><text x="36" y="231" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">keeps working when staff move rows or delete</text><text x="36" y="248" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">headers.</text><rect x="20" y="267" width="360" height="74" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="38" cy="288" r="4.5" fill="#bc8cff"/><text x="52" y="293" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Admin panel</text><text x="36" y="315" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">Auto and manual modes, manual edits, and one-</text><text x="36" y="332" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">time overrides that expire on their own.</text><rect x="20" y="351" width="360" height="74" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="38" cy="372" r="4.5" fill="#3fb950"/><text x="52" y="377" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Kiosk deployment</text><text x="36" y="399" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">A Raspberry Pi drives two monitors and opens</text><text x="36" y="416" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">Chromium full screen at boot.</text>
</svg>