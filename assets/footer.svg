<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="while (alive) { learn(); build(); share(); }">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b2545"/></linearGradient></defs>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .s{opacity:.35;animation:hl 6s infinite}
    .a{animation-delay:0s}.b{animation-delay:2s}.c{animation-delay:4s}
    @keyframes hl{0%,30%{opacity:1}35%,100%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1}}
  </style>
  <rect width="1200" height="90" rx="14" fill="url(#g)"/>
  <text x="600" y="54" text-anchor="middle" class="mono" font-size="22" fill="#8b949e">
    <tspan fill="#ff7b72">while</tspan> (alive) { <tspan class="s a" fill="#7ce0ff">learn();</tspan> <tspan class="s b" fill="#7ce0ff">build();</tspan> <tspan class="s c" fill="#7ce0ff">share();</tspan> }
  </text>
</svg>
