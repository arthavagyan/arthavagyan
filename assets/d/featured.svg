<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Quadrant Display Automation at TUMO: schedule screens that read live data from Google Sheets. Robust parsing, admin panel, Raspberry Pi kiosk.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2130"/><stop offset="1" stop-color="#0f141c"/></linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#1f6feb" stop-opacity=".42"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="878" height="298" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="878" height="298" rx="22" fill="url(#gl)"/>
  <rect x="1" y="1" width="878" height="298" rx="22" fill="url(#hi)"/>
  <rect x="1.5" y="1.5" width="877" height="297" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
  
  <g transform="translate(20,20) scale(1.000)"><rect width="56" height="56" rx="14.6" fill="#1f6feb"/><rect width="56" height="56" rx="14.6" fill="url(#ib)"/><rect x="12" y="15" width="32" height="21" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="24" y="38" width="8" height="4" fill="#fff"/><rect x="18" y="42" width="20" height="3" rx="1.5" fill="#fff"/></g><text x="92" y="44" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Quadrant Display Automation</text><text x="92" y="68" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="rgba(230,237,243,.62)" text-anchor="start">TUMO Center for Creative Technologies</text><text x="20" y="112" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">Staff used to update the center's schedule screens by hand. Now the screens read live data from</text><text x="20" y="134" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">Google Sheets and update themselves.</text><rect x="20" y="164" width="272" height="116" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="40" cy="188" r="5" fill="#58a6ff"/><text x="54" y="193" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Robust parsing</text><text x="36" y="220" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">Finds data blocks by cell formatting,</text><text x="36" y="239" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">so it keeps working when staff move</text><text x="36" y="258" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">rows or delete headers.</text><rect x="304" y="164" width="272" height="116" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="324" cy="188" r="5" fill="#bc8cff"/><text x="338" y="193" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Admin panel</text><text x="320" y="220" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">Auto and manual modes, manual edits,</text><text x="320" y="239" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">and one-time overrides that expire on</text><text x="320" y="258" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">their own.</text><rect x="588" y="164" width="272" height="116" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.09)"/><circle cx="608" cy="188" r="5" fill="#3fb950"/><text x="622" y="193" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Kiosk deployment</text><text x="604" y="220" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">A Raspberry Pi drives two monitors and</text><text x="604" y="239" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(230,237,243,.66)" text-anchor="start">opens Chromium full screen at boot.</text>
</svg>